name: ToolPicker dependency upgrade dry run

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade-dry-run:
    if: github.head_ref == 'toolpicker-one-page-buyer-pilot-20261021' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install baseline
        run: npm ci
      - name: Upgrade pinned stable Next.js and matching ESLint configuration
        run: npm install --save-exact next@16.4.2 eslint-config-next@16.4.2
      - name: Repair remaining dependency versions within stated ranges
        run: npm audit fix
        continue-on-error: true
      - name: Verify lockfile can be cleanly installed
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        if: success() || failure()
        run: npm run lint
      - name: Category gate tests
        if: success() || failure()
        run: npm run test:category-gates
      - name: SEO checks
        if: success() || failure()
        run: npm run seo:check
      - name: Build
        if: success() || failure()
        run: npm run build
      - name: Export proposed manifest and lockfile for manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolpicker-next-16-4-2-proposed-lock
          path: |
            package.json
            package-lock.json
          retention-days: 3

      - name: Stage tested dependencies on the existing draft branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          test "$TARGET_BRANCH" = "toolpicker-one-page-buyer-pilot-20261021"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
            exit 0
          fi
          git commit -m "chore: upgrade ToolPicker to patched Next.js 16.4.2"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
